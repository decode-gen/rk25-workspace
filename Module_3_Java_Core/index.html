<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Học phần đang tạm khóa | Rikkei Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f4f4;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .lock-card {
      max-width: 460px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 40px 32px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }
    .lock-icon {
      font-size: 42px;
      margin-bottom: 16px;
      line-height: 1;
    }
    h1 {
      font-size: 18px;
      font-weight: 800;
      color: #111111;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #666666;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-back {
      display: inline-block;
      padding: 8px 18px;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    .btn-back:hover {
      background: #333333;
    }
    .footer-text {
      margin-top: 24px;
      font-size: 11px;
      color: #999999;
    }
  </style>
</head>
<body>
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <h1>Học Phần Đang Tạm Khóa</h1>
    <p>Quyền truy cập học phần này hiện đang được bảo lưu theo kế hoạch đào tạo của Rikkei Academy. Vui lòng quay lại Dashboard chính.</p>
    <a href="../Dashboard_v1/index.html" class="btn-back">← Quay lại Dashboard</a>
    <div class="footer-text">Rikkei Education · Access Restricted</div>
  </div>
  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && e.key === 'u')) {
        e.preventDefault();
      }
    });
    setTimeout(() => {
      window.location.href = '../Dashboard_v1/index.html';
    }, 2500);
  </script>
</body>
</html>
